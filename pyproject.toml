[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piqs-conformance"
version = "0.1.0"
description = "Structural design-pattern conformance checking for Java, independent of identifier names"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
piqs-check = "piqs.cli:main"

[tool.setuptools]
packages = ["piqs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
